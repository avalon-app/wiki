# 不同人数下的阵营分布
# 字段：
#   players: 总人数
#   variant: base / lancelot —— 基础规则 / 启用兰斯洛特扩展
#   good:    正义阵营人数
#   evil:    邪恶阵营人数
#   missionSize: 第 1..5 轮任务的人数（length = 5）
#   doubleFailRound: 失败需要 2 张失败牌的轮次（仅 7 人以上的第 4 轮）

# --- 基础规则 ---
- players: 5
  variant: base
  good: 3
  evil: 2
  missionSize: [2, 3, 2, 3, 3]
- players: 6
  variant: base
  good: 4
  evil: 2
  missionSize: [2, 3, 4, 3, 4]
- players: 7
  variant: base
  good: 4
  evil: 3
  missionSize: [2, 3, 3, 4, 4]
  doubleFailRound: 4
- players: 8
  variant: base
  good: 5
  evil: 3
  missionSize: [3, 4, 4, 5, 5]
  doubleFailRound: 4
- players: 9
  variant: base
  good: 6
  evil: 3
  missionSize: [3, 4, 4, 5, 5]
  doubleFailRound: 4
- players: 10
  variant: base
  good: 6
  evil: 4
  missionSize: [3, 4, 4, 5, 5]
  doubleFailRound: 4

# --- 兰斯洛特扩展 ---
- players: 7
  variant: lancelot
  good: 4
  evil: 3
  missionSize: [2, 3, 3, 4, 4]
  doubleFailRound: 4
- players: 8
  variant: lancelot
  good: 5
  evil: 3
  missionSize: [3, 4, 4, 5, 5]
  doubleFailRound: 4
- players: 9
  variant: lancelot
  good: 6
  evil: 3
  missionSize: [3, 4, 4, 5, 5]
  doubleFailRound: 4
- players: 10
  variant: lancelot
  good: 6
  evil: 4
  missionSize: [3, 4, 4, 5, 5]
  doubleFailRound: 4
- players: 11
  variant: lancelot
  good: 7
  evil: 4
  missionSize: [3, 4, 5, 6, 6]
  doubleFailRound: 4
- players: 12
  variant: lancelot
  good: 7
  evil: 5
  missionSize: [3, 4, 5, 6, 6]
  doubleFailRound: 4
